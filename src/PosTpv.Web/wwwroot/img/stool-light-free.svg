<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 28 28" width="28" height="28">
  <!-- Modern bar stool seen from above (stool image for bar tables, see Tables.razor.css):
       light theme, free table. Chrome footrest ring, padded round seat with a stitched
       edge, and a low curved backrest on the side facing away from the bar. -->
  <defs>
    <filter id="s" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="1.3" stdDeviation="1" flood-color="#000" flood-opacity=".32"/></filter>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1f4f7"/><stop offset=".5" stop-color="#a9b2bc"/><stop offset="1" stop-color="#e3e8ed"/></linearGradient>
    <radialGradient id="seat" cx=".38" cy=".34" r=".75"><stop offset="0" stop-color="#5b6573"/><stop offset="1" stop-color="#2b313a"/></radialGradient>
  </defs>
  <g filter="url(#s)">
    <circle cx="12" cy="12" r="11" fill="none" stroke="url(#chrome)" stroke-width="1.5"/>
    <circle cx="12" cy="12" r="8.3" fill="url(#seat)" stroke="#1a1e24" stroke-width=".7"/>
    <circle cx="12" cy="12" r="6.6" fill="none" stroke="rgba(255,255,255,.38)" stroke-width=".45" stroke-dasharray=".9 .8"/>
    <path d="M3.48 8.03 A9.4 9.4 0 0 1 20.52 8.03" fill="none" stroke="#1c2026" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M3.48 8.03 A9.4 9.4 0 0 1 20.52 8.03" fill="none" stroke="rgba(255,255,255,.22)" stroke-width=".6" stroke-linecap="round" transform="translate(0 -.7)"/>
    <circle cx="12" cy="12" r=".9" fill="#1a1e24" opacity=".6"/>
  </g>
</svg>
