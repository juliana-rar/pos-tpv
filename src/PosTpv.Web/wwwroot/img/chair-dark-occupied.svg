<svg xmlns="http://www.w3.org/2000/svg" viewBox="-3 -2 20 25.6" width="20" height="25.6">
  <!-- Modern dining chair seen from above (see .tbl__chair in Tables.razor.css): dark theme,
       occupied table. Padded rounded seat with a stitched edge and a thin curved backrest. -->
  <defs>
    <filter id="s" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="1.3" stdDeviation="1" flood-color="#000" flood-opacity=".3"/></filter>
    <radialGradient id="seat" cx=".38" cy=".34" r=".8"><stop offset="0" stop-color="#ffd98a"/><stop offset="1" stop-color="#e0a53a"/></radialGradient>
  </defs>
  <g filter="url(#s)">
    <rect x=".6" y="5.9" width="12.8" height="12.8" rx="4.6" fill="url(#seat)" stroke="#8f6417" stroke-width=".7"/>
    <rect x="2.2" y="7.5" width="9.6" height="9.6" rx="3.3" fill="none" stroke="rgba(255,255,255,.6)" stroke-width=".45" stroke-dasharray=".9 .8"/>
    <path d="M1.4 4.6 Q7 .6 12.6 4.6" fill="none" stroke="#b3801f" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M2.4 3.7 Q7 .5 11.6 3.7" fill="none" stroke="rgba(255,255,255,.22)" stroke-width=".55" stroke-linecap="round"/>
  </g>
</svg>
